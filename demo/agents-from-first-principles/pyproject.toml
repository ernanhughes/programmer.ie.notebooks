[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "first-principles-agent-demo"
version = "0.1.0"
description = "Runnable capstone for Agents From First Principles"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["first_principles_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
